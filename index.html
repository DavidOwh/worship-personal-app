<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>我的敬拜歌单</title>
  <meta name="theme-color" content="#7c6af7" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="敬拜歌单" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<!-- ── Browse page ─────────────────────────── -->
<div id="browsePage" class="page active">
  <div class="page-header">
    <h1>🎵 浏览歌曲</h1>
    <input id="searchInput" class="search-input" type="search" placeholder="🔍 搜索歌曲…" />
    <div class="cat-scroll" id="catFilter">
      <button class="cat-pill active" data-cat="all">全部</button>
      <button class="cat-pill" data-cat="praise">赞美</button>
      <button class="cat-pill" data-cat="worship">敬拜</button>
      <button class="cat-pill" data-cat="fast">快歌</button>
      <button class="cat-pill" data-cat="dialect">方言</button>
      <button class="cat-pill" data-cat="lifeline">生命之光</button>
    </div>
  </div>
  <div class="song-list" id="browseList">
    <div class="loading">加载中…</div>
  </div>
</div>

<!-- ── My Playlist page ────────────────────── -->
<div id="playlistPage" class="page">
  <div class="page-header">
    <h1>📋 我的歌单</h1>
  </div>
  <div class="song-list" id="playlistList"></div>
</div>

<!-- ── Player page ─────────────────────────── -->
<div id="playerPage" class="page">
  <div class="player-header">
    <button class="back-btn" id="backBtn">‹ 返回</button>
    <div class="player-song-title" id="playerTitle">—</div>
  </div>

  <div class="youtube-wrap">
    <div class="youtube-placeholder" id="ytPlaceholder">
      <span class="big">🎵</span>
      <span>此歌曲没有 YouTube 视频</span>
    </div>
    <div id="ytPlayer"></div>
  </div>

  <div class="player-controls">
    <button class="ctrl-btn" id="prevBtn">‹ 上首 Prev</button>
    <button class="ctrl-btn" id="replayBtn">↺ 重播 Replay</button>
    <button class="ctrl-btn" id="loopBtn">⟳ 循环 Loop: Off</button>
    <button class="ctrl-btn" id="nextBtn">下首 Next ›</button>
  </div>

  <div class="lyrics-panel" id="lyricsPanel">
    <div class="lyrics-text" id="lyricsText"></div>
  </div>
</div>

<!-- ── Bottom Nav ──────────────────────────── -->
<nav class="bottom-nav">
  <button class="nav-btn active" data-page="browsePage">
    <span class="nav-icon">🔍</span>
    <span>浏览</span>
  </button>
  <button class="nav-btn" data-page="playlistPage" style="position:relative">
    <span class="nav-icon">📋</span>
    <span>我的歌单</span>
    <span class="nav-badge" id="playlistBadge" style="display:none">0</span>
  </button>
  <button class="nav-btn" data-page="playerPage" id="nowPlayingNav">
    <span class="nav-icon">▶️</span>
    <span>正在播放</span>
  </button>
</nav>

<script src="/js/app.js"></script>
</body>
</html>
